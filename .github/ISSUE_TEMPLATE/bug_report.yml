name: Bug report
description: Something in cinc isn't working the way you expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! The more of the
        details below you can fill in, the faster we can reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw, from your point of view.
      placeholder: I ran `cinc node show web01` and it returned an empty document.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: I expected the node's full JSON, the same as `knife node show`.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran. Redact any secrets first.
      render: shell
      placeholder: |
        cinc node show web01 --format json
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cinc version
      description: Paste the output of `cinc version`.
      placeholder: cinc 0.17.0 (abc1234, 2026-06-27)
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: What server are you talking to?
      options:
        - Cinc Server
        - Chef Infra Server
        - cinc-zero / chef-zero
        - Not sure / other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15.5 (arm64)
    validations:
      required: false
  - type: textarea
    id: output
    attributes:
      label: Relevant output or logs
      description: Any error text or unexpected output. This is automatically formatted, so no backticks needed.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and didn't find a duplicate.
          required: true
        - label: I'm running the latest released version of cinc, or have noted my version above.
          required: true
