name: Acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance (cinc-zero)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run acceptance tests
        # The harness downloads and caches the pinned cinc-zero release binary.
        # gotestsum streams each test as it finishes, so these longer-running
        # cinc-zero tests show live progress instead of one buffered dump.
        run: gotestsum --format testname -- -tags acceptance -count=1 ./test/...
