name: Acceptance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    name: Acceptance (cinc-zero)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run acceptance tests
        # The harness downloads and caches the pinned cinc-zero release binary.
        # gotestsum streams each test as it finishes, so these longer-running
        # cinc-zero tests show live progress instead of one buffered dump.
        run: gotestsum --format testname -- -tags acceptance -count=1 ./test/...
