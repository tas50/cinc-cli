name: Update generated docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate docs/commands
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # DOCS_BOT_TOKEN is a PAT (or GitHub App token) whose owner is
          # on main's branch-protection bypass list. The default
          # GITHUB_TOKEN cannot push to main because branch protection
          # requires status checks it can't satisfy from this workflow.
          # SECURITY FOLLOW-UP: this branch-protection-bypass credential
          # should migrate to a repo-scoped GitHub App installation token
          # (short-lived, least-privilege) rather than a long-lived PAT.
          # That requires a maintainer to provision the App and store its
          # credentials; left as-is here to avoid breaking CI in the meantime.
          token: ${{ secrets.DOCS_BOT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate docs
        run: make docs

      # The "Commit if changed" step is a no-op when docs/commands
      # already matches the cobra command tree, so a clean run never
      # produces a push. A push made by this workflow re-triggers
      # docs.yml, but the follow-up run finds a clean tree and exits
      # without pushing, so the loop terminates after one extra
      # no-op run.
      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain docs/commands)" ]]; then
            echo "docs/commands already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commands
          git commit -m "Regenerate docs/commands from cobra command tree"
          git push
