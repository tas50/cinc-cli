name: Update generated docs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  regenerate:
    name: Regenerate docs/commands
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate docs
        run: make docs

      # The "Commit if changed" step is a no-op when docs/commands
      # already matches the cobra command tree, so a clean run never
      # produces a push. Pushes made with the default GITHUB_TOKEN do
      # not trigger further workflow runs, so this won't recurse even
      # when it does commit.
      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain docs/commands)" ]]; then
            echo "docs/commands already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/commands
          git commit -m "Regenerate docs/commands from cobra command tree"
          git push
