[[command]]
path = "supermarket download"
status = "exempt"
reason = "Fetches a cookbook tarball from the external Chef Supermarket service, which the cinc-zero harness does not (and should not) stand up. Covered by the unit test apps/cinc/cmd/supermarket_download_test.go against an httptest Supermarket."

[[command]]
path = "supermarket explore"
status = "exempt"
reason = "Interactive Supermarket TUI; it needs a real terminal and the external Supermarket service, so it can't be driven headlessly against cinc-zero. Covered by apps/cinc/cmd/supermarket_test.go and supermarket_show_test.go."

[[command]]
path = "supermarket install"
status = "exempt"
reason = "Downloads from the external Chef Supermarket then uploads to the server; a live test would need a real Supermarket. The full download-and-upload-to-server flow is exercised with httptest doubles in apps/cinc/cmd/supermarket_install_test.go, and the server-side cookbook upload it performs is independently covered against cinc-zero by TestCookbookUploadDeleteAgainstCincZero."

[[command]]
path = "supermarket list"
status = "exempt"
reason = "Reads from the external Chef Supermarket service. Covered by the unit test apps/cinc/cmd/supermarket_list_test.go against an httptest Supermarket."

[[command]]
path = "supermarket search"
status = "exempt"
reason = "Queries the external Chef Supermarket service. Covered by the unit test apps/cinc/cmd/supermarket_search_test.go against an httptest Supermarket."

[[command]]
path = "supermarket share"
status = "exempt"
reason = "Publishes a cookbook to the external Chef Supermarket service (requires Supermarket credentials). Covered by the unit test apps/cinc/cmd/supermarket_test.go."

[[command]]
path = "supermarket show"
status = "exempt"
reason = "Reads cookbook metadata from the external Chef Supermarket service. Covered by the unit test apps/cinc/cmd/supermarket_show_test.go against an httptest Supermarket."

