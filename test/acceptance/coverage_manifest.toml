# coverage_manifest.toml — acceptance-test coverage for every leaf command.
#
# One [[command]] per leaf in the live cinc tree (cmd.NewRootCmd()). Each is
# either:
#   status = "covered"  with tests = [...]  naming the acceptance test funcs, or
#   status = "exempt"   with a non-empty reason explaining why no live
#                       cinc-zero acceptance test exists.
#
# coverage_meta_test.go enforces that this file stays in lockstep with the
# command tree: every leaf must appear here exactly once, every covered test
# must exist, and no entry may be stale. Add a [[command]] when you add a leaf.

